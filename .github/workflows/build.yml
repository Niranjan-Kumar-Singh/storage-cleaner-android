name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Decode Release Keystore (if secret is configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            echo "Release keystore decoded successfully."
          else
            echo "No custom release keystore secret found; build will use fallback keystore."
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew 2>/dev/null || true

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug & Release APKs
        env:
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          gradle assembleRelease --no-daemon --stacktrace

      - name: Organize APK Artifacts
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk/ -name "*.apk" -type f -exec cp {} artifacts/ \;
          ls -la artifacts/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StorageCleaner-APKs
          path: artifacts/*.apk
          retention-days: 30

      - name: Publish to GitHub Releases (latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            artifacts/*.apk \
            --title "Latest build (run #${{ github.run_number }})" \
            --notes "### Storage Cleaner APKs (Build #${{ github.run_number }})

          Automatically built from commit \`${{ github.sha }}\` on branch \`main\`.

          #### 📱 Download Options
          - **Download**: Grab the \`.apk\` file from the Assets section below.

          #### 🛠️ Installation Instructions
          1. Download the APK directly onto your Android device
          2. Enable **Install unknown apps** in Android Settings if prompted
          3. Tap **Install** and open Storage Cleaner"
