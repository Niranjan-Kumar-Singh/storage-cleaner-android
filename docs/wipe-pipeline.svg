<svg width="960" height="170" viewBox="0 0 960 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pipeBg" x1="0" y1="0" x2="960" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090C12"/>
      <stop offset="100%" stop-color="#111622"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4263EB" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2DD4BF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#4263EB" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="956" height="166" rx="16" fill="url(#pipeBg)" stroke="#232D42" stroke-width="1.5"/>
  <text x="28" y="34" fill="#94A3B8" font-family="JetBrains Mono, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.2">
    DOD 5220.22-M SECURE WIPE SEQUENCE
  </text>

  <!-- Connector Track -->
  <line x1="120" y1="92" x2="840" y2="92" stroke="#232D42" stroke-width="3" stroke-linecap="round"/>
  <!-- Animated Pulse Packet -->
  <circle cx="120" cy="92" r="5" fill="#2DD4BF">
    <animate attributeName="cx" values="120;840;120" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Stage 1 -->
  <rect x="28" y="54" width="196" height="84" rx="12" fill="#161D2D" stroke="#4263EB" stroke-width="1.5"/>
  <text x="44" y="78" fill="#829BFF" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">PASS 01 · ZERO FILL</text>
  <text x="44" y="102" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="14" font-weight="700">0x00 Byte Stream</text>
  <text x="44" y="122" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11.5">Overwrite + fd.sync()</text>

  <!-- Stage 2 -->
  <rect x="264" y="54" width="196" height="84" rx="12" fill="#161D2D" stroke="#0D9488" stroke-width="1.5"/>
  <text x="280" y="78" fill="#2DD4BF" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">PASS 02 · ONES FILL</text>
  <text x="280" y="102" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="14" font-weight="700">0xFF Byte Stream</text>
  <text x="280" y="122" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11.5">Overwrite + fd.sync()</text>

  <!-- Stage 3 -->
  <rect x="500" y="54" width="196" height="84" rx="12" fill="#161D2D" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="516" y="78" fill="#FBBF24" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">PASS 03 · CSPRNG</text>
  <text x="516" y="102" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="14" font-weight="700">SecureRandom()</text>
  <text x="516" y="122" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11.5">Entropy + fd.sync()</text>

  <!-- Stage 4 -->
  <rect x="736" y="54" width="196" height="84" rx="12" fill="#161D2D" stroke="#E11D48" stroke-width="1.5"/>
  <text x="752" y="78" fill="#FB7185" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">FINALIZE · UNLINK</text>
  <text x="752" y="102" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="14" font-weight="700">Truncate &amp; Erase</text>
  <text x="752" y="122" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11.5">setLength(0) + delete()</text>
</svg>
