<svg width="960" height="250" viewBox="0 0 960 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090C12"/>
      <stop offset="55%" stop-color="#0F1523"/>
      <stop offset="100%" stop-color="#111B2E"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4263EB"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2DD4BF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#4263EB" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#232D42" opacity="0.65"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="4" y="4" width="952" height="242" rx="20"/>
    </clipPath>
  </defs>

  <!-- Card Background -->
  <rect x="4" y="4" width="952" height="242" rx="20" fill="url(#bg)" stroke="#232D42" stroke-width="1.5"/>
  <rect x="4" y="4" width="952" height="242" rx="20" fill="url(#grid)" clip-path="url(#cardClip)"/>

  <!-- Animated Horizontal Scanner Sweep -->
  <g clip-path="url(#cardClip)">
    <rect x="-200" y="4" width="180" height="242" fill="url(#sweepGrad)" opacity="0.45">
      <animate attributeName="x" values="-200;1050;-200" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Left Animated Shield Emblem -->
  <g transform="translate(88, 62)">
    <!-- Rotating Orbital Ring -->
    <circle cx="62" cy="62" r="56" stroke="url(#accentGrad)" stroke-width="1.5" stroke-dasharray="10 8" opacity="0.65">
      <animateTransform attributeName="transform" type="rotate" from="0 62 62" to="360 62 62" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="62" cy="62" r="46" fill="#161D2D" stroke="#232D42" stroke-width="1.5"/>
    <!-- Shield Shape -->
    <path d="M62 28 L90 40 C90 61 78 82 62 94 C46 82 34 61 34 40 Z" fill="url(#accentGrad)" opacity="0.92"/>
    <path d="M62 34 L84 43 C84 59 75 76 62 86 Z" fill="#FFFFFF" opacity="0.16"/>
    <!-- Animated Check / Spark -->
    <path d="M51 62 L59 70 L75 53" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Title & Tagline -->
  <text x="236" y="102" fill="#F8FAFC" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">
    Storage Cleaner
  </text>
  <text x="238" y="135" fill="#94A3B8" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="500">
    Precision Android Storage Analyzer · Exact Duplicate Resolver · DoD 5220.22-M Eraser
  </text>

  <!-- Animated Status Pill -->
  <rect x="238" y="158" width="268" height="30" rx="15" fill="#161D2D" stroke="#232D42" stroke-width="1"/>
  <circle cx="256" cy="173" r="4.5" fill="#10B981">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="270" y="177" fill="#E2E8F0" font-family="JetBrains Mono, Consolas, monospace" font-size="11.5" font-weight="600">
    ON-DEVICE ENGINE · ZERO TELEMETRY
  </text>

  <!-- Feature Pills -->
  <rect x="520" y="158" width="110" height="30" rx="15" fill="#3653C9" opacity="0.22" stroke="#4263EB" stroke-width="1"/>
  <text x="575" y="177" text-anchor="middle" fill="#91A7FF" font-family="Inter, sans-serif" font-size="11.5" font-weight="700">SHA-256</text>

  <rect x="642" y="158" width="128" height="30" rx="15" fill="#0F766E" opacity="0.25" stroke="#14B8A6" stroke-width="1"/>
  <text x="706" y="177" text-anchor="middle" fill="#2DD4BF" font-family="Inter, sans-serif" font-size="11.5" font-weight="700">3-PASS WIPE</text>

  <rect x="782" y="158" width="120" height="30" rx="15" fill="#161D2D" stroke="#232D42" stroke-width="1"/>
  <text x="842" y="177" text-anchor="middle" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="11.5" font-weight="700">COMPOSE M3</text>
</svg>
